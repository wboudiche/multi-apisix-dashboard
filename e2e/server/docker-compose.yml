services:
  apisix:
    image: apache/apisix:3.16.0-debian
    restart: always
    volumes:
      - ./apisix_conf.yml:/usr/local/apisix/conf/config.yaml:ro
    environment:
      # See apisix_conf.yml: only this gateway publishes its Control API.
      APISIX_CONTROL_IP: 0.0.0.0
    # A unix socket left behind in logs/ survives a container restart, and
    # nginx refuses to bind a path that already exists:
    #
    #   [emerg] bind() to unix:.../stream_worker_events.sock failed
    #           (98: Address already in use)
    #
    # With restart: always that becomes a crash loop the container never gets
    # out of, and only a --force-recreate clears it. Clear the sockets before
    # handing over to the image's own entrypoint.
    #
    # Deliberately not a tmpfs over logs/: that directory holds the
    # access.log -> /dev/stdout and error.log -> /dev/stderr symlinks the image
    # ships, and mounting over it both hides them (silencing docker logs) and
    # arrives root-owned, which the apisix user cannot write to.
    entrypoint:
      - /bin/sh
      - -c
      - rm -f /usr/local/apisix/logs/*.sock; exec /docker-entrypoint.sh docker-start
    ports:
      # The gateway, not only the Admin API: a route test sends a request
      # through it, and the backend reaches it from the host. Set
      # E2E_GATEWAY_PORT where another stack already holds 9080, and point
      # E2E_LOCAL_GATEWAY_URL at the same port (#152).
      - '${E2E_GATEWAY_PORT:-9080}:9080'
      - '9180:9180'
      # The Control API, which reports what the health checkers have seen
      # (#281). Only this stack's first gateway publishes it: the second one
      # exists to prove the dashboard keeps two apart, and keeps APISIX's
      # loopback default (APISIX_CONTROL_IP unset), so it publishes no
      # control address - the ordinary case worth testing too.
      #
      # Bound to the host's loopback rather than every interface: this API is
      # not read-only - it reloads plugins and triggers dumps - and everything
      # that reads it here runs on the host.
      - '127.0.0.1:9090:9090'
    depends_on:
      - etcd
    networks:
      - apisix

  apisix2:
    image: apache/apisix:3.16.0-debian
    restart: always
    volumes:
      - ./apisix_conf.yml:/usr/local/apisix/conf/config.yaml:ro
    environment:
      # Same file as the first gateway, its own etcd prefix (see the comment on
      # `prefix` in apisix_conf.yml).
      APISIX_ETCD_PREFIX: /apisix2
    # A unix socket left behind in logs/ survives a container restart, and
    # nginx refuses to bind a path that already exists:
    #
    #   [emerg] bind() to unix:.../stream_worker_events.sock failed
    #           (98: Address already in use)
    #
    # With restart: always that becomes a crash loop the container never gets
    # out of, and only a --force-recreate clears it. Clear the sockets before
    # handing over to the image's own entrypoint.
    #
    # Deliberately not a tmpfs over logs/: that directory holds the
    # access.log -> /dev/stdout and error.log -> /dev/stderr symlinks the image
    # ships, and mounting over it both hides them (silencing docker logs) and
    # arrives root-owned, which the apisix user cannot write to.
    entrypoint:
      - /bin/sh
      - -c
      - rm -f /usr/local/apisix/logs/*.sock; exec /docker-entrypoint.sh docker-start
    ports:
      - '9181:9180'
    depends_on:
      - etcd
    networks:
      - apisix

  etcd:
    image: bitnamilegacy/etcd:3.5
    restart: always
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: 'true'
      ALLOW_NONE_AUTHENTICATION: 'yes'
      ETCD_ADVERTISE_CLIENT_URLS: 'http://etcd:2379'
      ETCD_LISTEN_CLIENT_URLS: 'http://0.0.0.0:2379'
    ports:
      - '2379:2379'
    networks:
      - apisix

networks:
  apisix:
    driver: bridge

volumes:
  etcd_data:
