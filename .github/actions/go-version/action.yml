name: Go version
description: >
  The Go minor api/go.mod declares, and - unless told not to - its latest
  patch installed.

# The version was written by hand in each workflow and in the Dockerfile,
# beside the directive in api/go.mod, which is the one Dependabot edits.
# setup-go and the golang image both run with GOTOOLCHAIN=local, so each
# refuses a go.mod that asks for more than it is: the bump that raised the
# directive to 1.26 stayed red until the pins were moved by hand (#368).
#
# The minor, not the directive's own version: `go 1.26.0` names the first
# release of 1.26, and a build that took it literally would test and ship a
# toolchain without the fixes since. `1.26.x` is the latest patch, which is
# also what the golang:1.26-alpine image holds - so the browser suite runs the
# Go the image is built with.

inputs:
  install:
    description: Whether to install that Go, or only say which it is.
    default: "true"

outputs:
  minor:
    description: The minor version, as `1.26`.
    value: ${{ steps.directive.outputs.minor }}

runs:
  using: composite
  steps:
    - id: directive
      shell: bash
      run: |
        minor=$(sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' api/go.mod)
        if [ -z "$minor" ]; then
          echo "::error file=api/go.mod::no go directive found"
          exit 1
        fi
        echo "minor=$minor" >> "$GITHUB_OUTPUT"

    - if: inputs.install == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.directive.outputs.minor }}.x
        cache-dependency-path: api/go.sum
