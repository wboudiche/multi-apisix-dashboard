name: Build and unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The e2e job is the only other gate on a frontend change, and it takes ten
    # minutes a shard. This answers the questions that do not need a browser —
    # does it compile, do the unit tests pass — in about a minute, so a broken
    # type or a failed invariant is reported before the shards even start.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # eslint with --max-warnings=0. main failed it for long enough that it
      # was left out of CI (#212); it is clean now, and this keeps it clean.
      - name: Lint
        run: pnpm lint

      # Type-checks and bundles. `pnpm build` is `tsc -b && vite build`, so this
      # also catches a vite config that no longer compiles — the failure mode
      # behind #139, which only surfaced inside a docker build step.
      - name: Build
        run: pnpm build

      # Includes src/react-version-pairing.test.ts, which is the only automated
      # guard on the react/react-dom invariant from #121.
      - name: Unit tests
        run: pnpm test

  backend:
    # The backend's own tests ran nowhere: the e2e job builds the binary and
    # drives it through a browser, which says it compiles and that the specs
    # still pass, not that `go test` does. The access rules live here — the
    # per-instance role, the team boundary in the proxy, the password policy —
    # and #339 went green on nine checks without one of their tests having
    # run (#367).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      # The version api/go.mod declares, not a number written here: a bump of
      # the directive moves this job with it, in the same pull request.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      # No etcd and no gateway: the tests bring their own fakes. -race because
      # the services answer concurrent requests over shared state - the
      # overview's singleflight group, for one.
      - name: Unit tests
        run: go test -race ./...
