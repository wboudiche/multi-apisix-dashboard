titleOnly: true
# The types of CONTRIBUTING.md, and `revert`, which it gives a header of its
# own. `chore`, `style`, `change` and `backport` were accepted here and are in
# no rule of ours: it is how `chore(deps)` was never refused (#369).
types:
  - feat
  - fix
  - docs
  - refactor
  - perf
  - test
  - build
  - ci
  - revert
